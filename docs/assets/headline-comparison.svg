<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title description">
  <title id="title">Same processed tokens, different corpus exposure</title>
  <desc id="description">Across three paired seeds, the in-domain generalization gap grows to 0.0585 when a small corpus is repeatedly replayed, versus 0.0158 when the same token budget comes from a broader corpus.</desc>
  <rect width="1000" height="520" rx="18" fill="#ffffff"/>
  <text x="72" y="48" fill="#172033" font-family="system-ui, sans-serif" font-size="25" font-weight="700">Same processed tokens, different corpus exposure</text>
  <text x="72" y="76" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">Held-out chapters · 3 paired seeds · bars = seed range</text>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="80" y1="112" x2="940" y2="112"/>
    <line x1="80" y1="194" x2="940" y2="194"/>
    <line x1="80" y1="276" x2="940" y2="276"/>
    <line x1="80" y1="358" x2="940" y2="358"/>
    <line x1="80" y1="440" x2="940" y2="440"/>
  </g>
  <line x1="80" y1="399" x2="940" y2="399" stroke="#94a3b8" stroke-width="2"/>

  <g fill="#64748b" font-family="system-ui, sans-serif" font-size="12">
    <text x="68" y="116" text-anchor="end">0.07</text>
    <text x="68" y="198" text-anchor="end">0.05</text>
    <text x="68" y="280" text-anchor="end">0.03</text>
    <text x="68" y="362" text-anchor="end">0.01</text>
    <text x="68" y="444" text-anchor="end">−0.01</text>
    <text x="80" y="466" text-anchor="middle">0</text>
    <text x="295" y="466" text-anchor="middle">138K</text>
    <text x="510" y="466" text-anchor="middle">275K</text>
    <text x="725" y="466" text-anchor="middle">413K</text>
    <text x="940" y="466" text-anchor="middle">551K</text>
    <text x="510" y="500" text-anchor="middle" font-size="14" fill="#334155">Processed character tokens</text>
    <text transform="translate(20 276) rotate(-90)" text-anchor="middle" font-size="14" fill="#334155">In-domain validation NLL − train NLL</text>
  </g>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#334155">
    <line x1="590" y1="70" x2="620" y2="70" stroke="#2563eb" stroke-width="4"/>
    <text x="629" y="75">broad corpus</text>
    <line x1="745" y1="70" x2="775" y2="70" stroke="#dc2626" stroke-width="4"/>
    <text x="784" y="75">repeated corpus</text>
  </g>

  <g stroke="#2563eb" stroke-width="8" opacity="0.18">
    <line x1="80" y1="393.3" x2="80" y2="403.5"/><line x1="200" y1="378.6" x2="200" y2="388.5"/><line x1="320" y1="368.0" x2="320" y2="371.9"/><line x1="440" y1="356.3" x2="440" y2="360.2"/><line x1="560" y1="345.7" x2="560" y2="353.3"/><line x1="680" y1="337.5" x2="680" y2="350.3"/><line x1="800" y1="332.4" x2="800" y2="345.9"/><line x1="920" y1="327.8" x2="920" y2="342.6"/><line x1="940" y1="326.9" x2="940" y2="342.4"/>
  </g>
  <polyline points="80,399.1 200,383.2 320,369.4 440,358.3 560,348.9 680,342.7 800,337.7 920,334.6 940,334.2" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g stroke="#dc2626" stroke-width="8" opacity="0.18">
    <line x1="80" y1="399.4" x2="80" y2="408.2"/><line x1="200" y1="339.1" x2="200" y2="363.1"/><line x1="320" y1="284.8" x2="320" y2="326.9"/><line x1="440" y1="239.8" x2="440" y2="286.7"/><line x1="560" y1="200.6" x2="560" y2="253.5"/><line x1="680" y1="166.0" x2="680" y2="228.0"/><line x1="800" y1="141.2" x2="800" y2="206.5"/><line x1="920" y1="121.6" x2="920" y2="194.0"/><line x1="940" y1="119.5" x2="940" y2="190.6"/>
  </g>
  <polyline points="80,403.3 200,352.5 320,305.9 440,263.6 560,227.3 680,198.8 800,177.1 920,161.8 940,159.2" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#2563eb">
    <circle cx="80" cy="399.1" r="4"/><circle cx="200" cy="383.2" r="4"/><circle cx="320" cy="369.4" r="4"/><circle cx="440" cy="358.3" r="4"/><circle cx="560" cy="348.9" r="4"/><circle cx="680" cy="342.7" r="4"/><circle cx="800" cy="337.7" r="4"/><circle cx="920" cy="334.6" r="4"/><circle cx="940" cy="334.2" r="5"/>
  </g>
  <g fill="#dc2626">
    <circle cx="80" cy="403.3" r="4"/><circle cx="200" cy="352.5" r="4"/><circle cx="320" cy="305.9" r="4"/><circle cx="440" cy="263.6" r="4"/><circle cx="560" cy="227.3" r="4"/><circle cx="680" cy="198.8" r="4"/><circle cx="800" cy="177.1" r="4"/><circle cx="920" cy="161.8" r="4"/><circle cx="940" cy="159.2" r="5"/>
  </g>

  <g font-family="system-ui, sans-serif">
    <rect x="744" y="350" width="192" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="756" y="370" fill="#1d4ed8" font-size="12" font-weight="700">Broad final gap</text><text x="756" y="390" fill="#1e3a8a" font-size="16">0.0158</text>
    <rect x="720" y="92" width="216" height="50" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="732" y="112" fill="#b91c1c" font-size="12" font-weight="700">Repeated final gap</text><text x="732" y="132" fill="#7f1d1d" font-size="16">0.0585</text>
  </g>
</svg>
