<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title description">
  <title id="title">Same processed tokens, different corpus exposure</title>
  <desc id="description">Across three seeds, the generalization gap grows more quickly when a small corpus is repeatedly replayed than when the same token budget comes from a broad corpus.</desc>
  <rect width="1000" height="520" rx="18" fill="#ffffff"/>
  <text x="72" y="48" fill="#172033" font-family="system-ui, sans-serif" font-size="25" font-weight="700">Same processed tokens, different corpus exposure</text>
  <text x="72" y="76" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">Mean across three paired seeds · bars show observed range</text>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="80" y1="112" x2="940" y2="112"/>
    <line x1="80" y1="194" x2="940" y2="194"/>
    <line x1="80" y1="276" x2="940" y2="276"/>
    <line x1="80" y1="358" x2="940" y2="358"/>
    <line x1="80" y1="440" x2="940" y2="440"/>
  </g>
  <line x1="80" y1="338" x2="940" y2="338" stroke="#94a3b8" stroke-width="2"/>

  <g fill="#64748b" font-family="system-ui, sans-serif" font-size="12">
    <text x="68" y="116" text-anchor="end">0.06</text>
    <text x="68" y="198" text-anchor="end">0.04</text>
    <text x="68" y="280" text-anchor="end">0.02</text>
    <text x="68" y="362" text-anchor="end">0.00</text>
    <text x="68" y="444" text-anchor="end">−0.02</text>
    <text x="80" y="466" text-anchor="middle">0</text>
    <text x="295" y="466" text-anchor="middle">138K</text>
    <text x="510" y="466" text-anchor="middle">275K</text>
    <text x="725" y="466" text-anchor="middle">413K</text>
    <text x="940" y="466" text-anchor="middle">551K</text>
    <text x="510" y="500" text-anchor="middle" font-size="14" fill="#334155">Processed character tokens</text>
    <text transform="translate(20 276) rotate(-90)" text-anchor="middle" font-size="14" fill="#334155">Validation NLL − train NLL</text>
  </g>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#334155">
    <line x1="590" y1="70" x2="620" y2="70" stroke="#2563eb" stroke-width="4"/>
    <text x="629" y="75">broad corpus</text>
    <line x1="745" y1="70" x2="775" y2="70" stroke="#dc2626" stroke-width="4"/>
    <text x="784" y="75">repeated corpus</text>
  </g>

  <g stroke="#2563eb" stroke-width="8" opacity="0.18">
    <line x1="80" y1="337" x2="80" y2="345"/>
    <line x1="203" y1="322" x2="203" y2="332"/>
    <line x1="326" y1="306" x2="326" y2="320"/>
    <line x1="449" y1="290" x2="449" y2="308"/>
    <line x1="572" y1="276" x2="572" y2="296"/>
    <line x1="695" y1="262" x2="695" y2="286"/>
    <line x1="818" y1="246" x2="818" y2="276"/>
    <line x1="920" y1="232" x2="920" y2="270"/>
    <line x1="940" y1="228" x2="940" y2="270"/>
  </g>
  <polyline points="80,341 203,327 326,313 449,299 572,286 695,274 818,261 920,251 940,249" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g stroke="#dc2626" stroke-width="8" opacity="0.18">
    <line x1="80" y1="338" x2="80" y2="346"/>
    <line x1="203" y1="302" x2="203" y2="326"/>
    <line x1="326" y1="267" x2="326" y2="305"/>
    <line x1="449" y1="230" x2="449" y2="286"/>
    <line x1="572" y1="202" x2="572" y2="269"/>
    <line x1="695" y1="166" x2="695" y2="251"/>
    <line x1="818" y1="132" x2="818" y2="238"/>
    <line x1="920" y1="108" x2="920" y2="223"/>
    <line x1="940" y1="104" x2="940" y2="219"/>
  </g>
  <polyline points="80,342 203,314 326,286 449,257 572,235 695,210 818,188 920,171 940,167" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#2563eb">
    <circle cx="80" cy="341" r="4"/><circle cx="203" cy="327" r="4"/><circle cx="326" cy="313" r="4"/><circle cx="449" cy="299" r="4"/><circle cx="572" cy="286" r="4"/><circle cx="695" cy="274" r="4"/><circle cx="818" cy="261" r="4"/><circle cx="920" cy="251" r="4"/><circle cx="940" cy="249" r="5"/>
  </g>
  <g fill="#dc2626">
    <circle cx="80" cy="342" r="4"/><circle cx="203" cy="314" r="4"/><circle cx="326" cy="286" r="4"/><circle cx="449" cy="257" r="4"/><circle cx="572" cy="235" r="4"/><circle cx="695" cy="210" r="4"/><circle cx="818" cy="188" r="4"/><circle cx="920" cy="171" r="4"/><circle cx="940" cy="167" r="5"/>
  </g>

  <g font-family="system-ui, sans-serif">
    <rect x="760" y="278" width="176" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="772" y="298" fill="#1d4ed8" font-size="12" font-weight="700">Broad final gap</text>
    <text x="772" y="318" fill="#1e3a8a" font-size="16">0.0193</text>
    <rect x="744" y="112" width="192" height="50" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="756" y="132" fill="#b91c1c" font-size="12" font-weight="700">Repeated final gap</text>
    <text x="756" y="152" fill="#7f1d1d" font-size="16">0.0468</text>
  </g>
</svg>
